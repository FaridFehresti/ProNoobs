<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="ProNoobs Dota — a home for the next big play." />
    <title>ProNoobs Dota</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c10;
        color: #f4f3ef;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 44%, rgb(135 30 28 / 16%), transparent 43%),
          linear-gradient(145deg, #0b0c10 0%, #111217 52%, #0b0c10 100%);
      }

      main {
        position: relative;
        isolation: isolate;
        width: min(100% - 40px, 940px);
        padding: 90px 24px;
        text-align: center;
      }

      main::before,
      main::after {
        position: absolute;
        z-index: -1;
        content: "";
        border: 1px solid rgb(222 72 56 / 12%);
        border-radius: 50%;
        aspect-ratio: 1;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      main::before { width: min(78vw, 650px); }
      main::after { width: min(60vw, 500px); border-color: rgb(255 255 255 / 5%); }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 23px;
        color: #d85143;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .32em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 24px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: .7;
      }

      h1 {
        margin: 0;
        font-size: clamp(58px, 13vw, 136px);
        font-weight: 950;
        letter-spacing: -.085em;
        line-height: .86;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
        color: #d94738;
        font-size: .39em;
        letter-spacing: .46em;
        line-height: 1;
        margin: 24px 0 0 .46em;
      }

      .rule {
        width: 44px;
        height: 2px;
        margin: 37px auto 0;
        background: #d94738;
      }

      @media (max-width: 520px) {
        main { padding: 72px 12px; }
        .eyebrow { font-size: 10px; letter-spacing: .24em; }
        h1 { letter-spacing: -.075em; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="brand">
      <p class="eyebrow">The next big play</p>
      <h1 id="brand">ProNoobs<span>Dota</span></h1>
      <div class="rule" aria-hidden="true"></div>
    </main>
  </body>
</html>
